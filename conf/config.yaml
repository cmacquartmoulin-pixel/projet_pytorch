# -------------------------------
# conf/config.yaml
# -------------------------------
defaults:
  - model/mlp: classifier
  - model/cnn: simple
  - activation@cnn_activation : relu    # activation par défaut du CNN
  - activation@mlp_activation : relu    # activation par défaut du MLP
  - init@cnn_init             : xavier  # initialisation par défaut du CNN
  - init@mlp_init             : xavier  # initialisation par défaut du MLP  
  - optimizer: sgd
  - loss: cross_entropy
  - augmentation@augmentation.horizontal_flip: horizontal_flip
  - augmentation@augmentation.random_crop: random_crop
  - scheduler: step 
  - _self_

seed: 42
epochs: 15
batch_size: 32

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0005

debug: true
debug_size: 1000